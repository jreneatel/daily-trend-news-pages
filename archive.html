<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アーカイブ | Daily Trend News</title>
<link rel="stylesheet" href="./design-tokens.css">
<style>
:root {
  color-scheme: light;
  --bg:var(--dtn-bg, #f4f7f9);
  --bar:var(--dtn-nav, #fff);
  --panel:var(--dtn-surface, #fff);
  --panel-2:var(--dtn-surface-subtle, #edf2f5);
  --ink:var(--dtn-ink, #17222b);
  --muted:var(--dtn-muted, #526570);
  --faint:#70808a;
  --line:var(--dtn-line, #cbd8df);
  --accent:var(--dtn-accent, #08769b);
  --accent-strong:var(--dtn-accent-strong, #075985);
  --shadow:var(--dtn-shadow, 0 10px 30px rgb(15 23 42 / 8%));
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scrollbar-gutter: stable; }
body {
  margin: 0;
  font-family: var(--dtn-font, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.55;
}
.skip-link {
  align-items: center;
  display: inline-flex;
  min-height: 44px;
  position: fixed;
  left: 12px;
  top: 8px;
  z-index: 20;
  padding: 8px 10px;
  border-radius: 6px;
  color: #fff;
  background: var(--accent);
  font-weight: 800;
  text-decoration: none;
  transform: translateY(-140%);
}
.skip-link:focus {
  transform: translateY(0);
}
.appbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 16px;
  justify-content: space-between;
  min-height: 64px;
  padding: 8px max(16px, calc((100vw - 1120px) / 2));
  background: var(--bar);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 3px 14px rgb(15 23 42 / 5%);
}
.brand {
  align-items: center;
  color: var(--ink);
  display: inline-flex;
  flex: none;
  font-size: 1.05rem;
  font-weight: 850;
  min-height: 44px;
  text-decoration: none;
}
.brand::before {
  content: "";
  display: inline-block;
  width: 14px;
  height: 12px;
  margin-right: 8px;
  border: 2px solid var(--muted);
  border-radius: 2px;
  vertical-align: -1px;
  box-shadow: inset 4px 0 0 rgb(8 118 155 / 22%);
}
.global-nav {
  align-items:center;
  display:flex;
}
.desktop-menu,
.mobile-menu { align-items:center; display:flex; gap:6px; justify-content:flex-end; }
.global-nav a,
.mobile-more summary {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid transparent;
  border-radius: 999px;
  color: var(--muted);
  font-size: .86rem;
  font-weight: 720;
  text-decoration: none;
}
.mobile-menu { display:none; }
.mobile-more { position: relative; }
.mobile-more summary { cursor: pointer; list-style: none; }
.mobile-more summary::-webkit-details-marker { display: none; }
.mobile-more > div {
  background: var(--bar);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow:0 14px 35px rgb(15 23 42 / 16%);
  display: grid;
  min-width: 190px;
  padding: 8px;
  position: absolute;
  right: 0;
  top: calc(100% + 4px);
}
.global-nav a:hover,
.global-nav a:focus-visible,
.mobile-more summary:hover,
.mobile-more summary:focus-visible,
.global-nav a[aria-current="page"] {
  border-color: var(--line);
  background: var(--dtn-nav-hover, #edf4f7);
  color: var(--accent-strong);
}
.archive, .back-link {
  color: var(--muted);
  text-decoration: none;
}
.page {
  width: min(1210px, 100%);
  margin: 0 auto;
  padding: 18px clamp(14px, 4vw, 32px) 64px;
}
.hero {
  padding: 0 0 16px;
}
.eyebrow {
  margin: 0 0 4px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.hero h1 {
  margin: 0;
  font-size: clamp(34px, 5vw, 48px);
  line-height: 1.08;
  letter-spacing: 0;
}
.badges {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.badges span {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 4px 9px;
  border-radius: 6px;
  color: #fff;
  background: #1f6f78;
  font-size: 12px;
  font-weight: 700;
}
.page-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 18px;
}
.analytics-export {
  min-height: 34px;
  padding: 6px 12px;
  border: 1px solid rgba(79, 209, 197, .45);
  border-radius: 6px;
  color: #fff;
  background: var(--accent);
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}
.layout {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.sidebar {
  position: sticky;
  top: 62px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel-2);
  box-shadow: var(--shadow);
}
.side-title {
  padding: 8px 12px;
  color: var(--ink);
  background: #e3ebef;
  font-weight: 800;
}
.side-nav {
  display: grid;
  padding: 10px 6px;
}
.side-calendar {
  padding: 10px 8px 8px;
  border-bottom: 1px solid var(--line);
}
.side-calendar .calendar {
  grid-template-columns: 1fr;
  gap: 0;
}
.side-calendar .calendar-month {
  padding: 10px;
  border-color: var(--line);
  background: var(--panel);
}
.side-calendar .calendar-month h2 {
  margin-bottom: 8px;
  font-size: 13px;
}
.side-calendar .calendar-grid {
  gap: 3px;
}
.side-calendar .calendar-weekday,
.side-calendar .calendar-day {
  min-height: 24px;
  border-radius: 5px;
  font-size: 11px;
}
.calendar-more {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-align: right;
}
.side-archive,
.side-nav a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 44px;
  padding: 7px 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--ink);
  text-decoration: none;
  font-weight: 700;
}
.side-archive {
  display: none;
  margin: 10px 6px 0;
  border-color: rgb(8 118 155 / 35%);
  background: rgb(8 118 155 / 8%);
}
.side-nav a:hover,
.side-nav a:focus,
.side-archive:hover,
.side-archive:focus {
  border-color: var(--accent);
  background: var(--dtn-nav-hover, #edf4f7);
}
.side-nav small,
.side-archive small {
  color: var(--muted);
  font-weight: 500;
}
.content {
  min-width: 0;
}
h2 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 0;
}
h3 {
  margin: 8px 0;
  font-size: 16px;
  line-height: 1.48;
  letter-spacing: 0;
}
a {
  color: var(--ink);
  text-decoration: none;
}
a:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}
.genre-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  margin-bottom: 12px;
  cursor: pointer;
  list-style: none;
}
.genre-head::-webkit-details-marker { display: none; }
.genre-head::before {
  content: "▾";
  color: var(--accent);
  font-weight: 900;
}
.genre:not([open]) .genre-head::before {
  content: "▸";
}
.genre-head span {
  color: var(--muted);
  font-size: 12px;
}
.thumb {
  flex: 0 0 auto;
  width: 100%;
  height: 88px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background:
    linear-gradient(135deg, rgb(8 118 155 / 14%), rgb(255 255 255 / 70%));
  object-fit: cover;
}
.genre {
  --genre:#9ca3af;
  margin-top: 24px;
}
.tone-tech { --genre:#1d4ed8; }
.tone-safety { --genre:#92400e; }
.tone-life { --genre:#047857; }
.tone-money { --genre:#6d28d9; }
.tone-civic { --genre:#4338ca; }
.tone-entertainment { --genre:#be185d; }
.tone-sports { --genre:#0f766e; }
.tone-science { --genre:#0e7490; }
.tone-general { --genre:#64748b; }
.genre:first-child { margin-top: 0; }
.genre-head {
  border-bottom: 1px solid var(--line);
  padding-bottom: 9px;
}
.genre-head h2 { color: var(--genre); }
.grid {
  display: grid;
  gap: 7px;
}
.card {
  position: relative;
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  gap: 12px;
  min-width: 0;
  padding: 13px 42px 12px 12px;
  border: 1px solid var(--line);
  border-left: 5px solid var(--genre, #9ca3af);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  text-decoration: none;
  transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
}
.card.is-read {
  background: #eef2f4;
  border-color: #b9c6cd;
  border-left-color: #64748b;
}
.read-state {
  margin-left: auto;
  color: var(--accent-strong);
  font-weight: 800;
}
.labels {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 6px;
}
.labels span {
  padding: 2px 6px;
  border-radius: 5px;
  color: #334155;
  background: #eef2f6;
  font-size: 12px;
  font-weight: 700;
}
.card:hover,
.card:focus-visible {
  border-color: var(--accent);
  box-shadow: 0 10px 26px rgb(15 23 42 / 12%);
  transform: translateY(-1px);
}
.card::after {
  content: "↗";
  position: absolute;
  right: 12px;
  top: 50%;
  color: var(--muted);
  transform: translateY(-50%);
}
.card p { margin: 8px 0 0; font-size: 14px; }
.card .thumb {
  width: 100%;
  height: 74px;
  margin-top: 2px;
  padding: 0;
  border-radius: 8px;
}
.card-body {
  min-width: 0;
}
.card h3 {
  color: var(--ink);
}
.card:hover h3,
.card:focus-visible h3 {
  color: var(--accent-strong);
}
.summary-text { color: #405460; }
.meta { color: var(--muted); font-size: 13px; margin: 0; }
.meta span {
  color: var(--muted);
  font-weight: 600;
}
.meta {
  display: flex;
  gap: 8px;
  align-items: center;
}
dl { margin: 10px 0 0; display: grid; gap: 8px; }
dl div {
  border-top: 1px solid var(--line);
  padding-top: 8px;
}
dt {
  color: var(--faint);
  font-size: 12px;
  font-weight: 700;
}
dd {
  margin: 2px 0 0;
  font-size: 14px;
  color: #405460;
}
.empty { color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.archive-page { max-width: 960px; }
.archive-search,
.search-cta {
  margin: 0 0 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  padding: 14px;
}
.search-cta { align-items:center; display:flex; gap:18px; justify-content:space-between; }
.search-cta div { display:grid; gap:3px; }
.search-cta span { color:var(--muted); font-size:13px; }
.search-cta a { background:var(--accent); border-radius:8px; color:#fff; flex:none; font-weight:850; min-height:44px; padding:11px 14px; }
.archive-search label {
  display: block;
  margin-bottom: 8px;
  font-weight: 800;
}
.archive-search input {
  width: 100%;
  min-height: 40px;
  border: 1px solid #647b88;
  border-radius: 6px;
  padding: 8px 10px;
  color: var(--ink);
  background: #fff;
  font: inherit;
}
.search-results {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}
.search-result {
  display: grid;
  gap: 3px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #f8fafb;
}
.search-result span,
.search-result small {
  color: var(--muted);
}
.weekly-grid {
  display: grid;
  gap: 14px;
}
.weekly-topics { display:grid; gap:10px; margin-bottom:20px; }
.weekly-topics > h2 { margin-bottom:2px; }
.weekly-topic { border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:8px; background:var(--panel); padding:14px; }
.weekly-topic h2 { font-size:16px; margin:7px 0; }
.weekly-topic p { color:#405460; margin:0; }
.topic-status { border-radius:999px; display:inline-flex; font-size:12px; font-weight:850; padding:3px 8px; }
.status-新規 { background:#164e63; color:#cffafe; }.status-続報 { background:#3b3a14; color:#fef3c7; }.status-決着 { background:#14532d; color:#dcfce7; }
.topic-links { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; }
.topic-links a { color:var(--accent-strong); font-size:13px; font-weight:800; text-decoration:underline; }
.weekly-genre {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  padding: 14px;
}
.weekly-genre ul {
  margin: 10px 0 0;
  padding-left: 20px;
}
.weekly-genre li {
  margin: 9px 0;
}
.weekly-genre li span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}
.calendar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 14px;
}
.calendar-month {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  padding: 14px;
}
.calendar-month h2 {
  margin: 0 0 12px;
  font-size: 18px;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}
.calendar-weekday,
.calendar-day {
  display: grid;
  place-items: center;
  min-width: 0;
  min-height: 34px;
  border-radius: 6px;
  font-size: 13px;
}
.calendar-weekday {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}
.calendar-day {
  color: var(--faint);
  border: 1px solid #e1e8ec;
}
.calendar-day.is-empty {
  border-color: transparent;
}
.calendar-day.is-linked {
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 800;
  text-decoration: none;
}
.calendar-day.is-linked:hover,
.calendar-day.is-linked:focus-visible {
  background: var(--accent-strong);
}
.calendar-day.is-latest {
  box-shadow: 0 0 0 2px #17222b inset;
}
@media (max-width: 900px) {
  .appbar {
    align-items:center;
    display:grid;
    gap:0;
    min-height:112px;
    padding-block:6px;
  }
  .global-nav { width:100%; }
  .desktop-menu { display:none; }
  .mobile-menu { display:flex; flex-wrap:nowrap; justify-content:space-between; width:100%; }
  .mobile-menu > a,
  .mobile-more summary { padding-inline:10px; }
  .layout { grid-template-columns: 1fr; }
  .sidebar {
    position: static;
  }
  .side-calendar {
    display: none;
  }
  .side-archive {
    display: flex;
  }
  .side-nav {
    display: flex;
    overflow-x: auto;
    padding: 8px;
  }
  .side-archive {
    margin: 8px 8px 0;
  }
  .side-nav a {
    flex: 0 0 auto;
    gap: 16px;
  }
}
@media (max-width: 560px) {
  .page { padding: 14px 12px 44px; }
  .hero h1 { font-size: 34px; }
  .badges { flex-wrap: wrap; }
  .card { padding-right: 32px; }
  .card {
    grid-template-columns: 72px minmax(0, 1fr);
    gap: 10px;
  }
  .card .thumb {
    width: 100%;
    height: 54px;
    border-radius: 8px;
  }
  .reason-row {
    border-top-color: #394352;
  }
  .reason-row dt {
    color: var(--accent-strong);
  }
  .search-cta { align-items:stretch; flex-direction:column; }
  .search-cta a { justify-content:center; text-align:center; }
}
@media (max-width: 390px) {
  .appbar { padding-inline:12px; }
  .brand { font-size:.9rem; }
  .mobile-menu > a,
  .mobile-more summary { font-size:.73rem; padding-inline:6px; }
}
</style>
